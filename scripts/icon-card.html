<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px; height: 512px; overflow: hidden; background: #0d1117;
    display: flex; align-items: center; justify-content: center;
  }
  .tile {
    width: 448px; height: 448px; border-radius: 96px;
    background: linear-gradient(135deg, #161b22, #010409);
    border: 2px solid #30363d;
    display: flex; align-items: center; justify-content: center;
  }
  .tile span {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 190px; font-weight: 700; color: #3fb950;
  }
</style>
</head>
<body>
  <div class="tile"><span>&gt;_</span></div>
</body>
</html>
