<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- 微网格 -->
  <g stroke="#1c2530" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- 标题区 -->
  <text x="60" y="95" font-family="monospace" font-size="56" font-weight="bold" fill="url(#txt)" filter="url(#glow)">ros2-agent-workflow</text>
  <text x="62" y="140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#c9d1d9">让 AI Agent 安全、可复现地自动控制 ROS2 机器人</text>

  <!-- 链路: AGENT → MCP → SAFETY → ROS2 -->
  <g font-family="'PingFang SC','Microsoft YaHei',monospace" font-size="16">
    <!-- 节点1 AGENT -->
    <rect x="60" y="200" width="200" height="70" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="160" y="232" text-anchor="middle" fill="#58a6ff" font-weight="bold">AI Agent</text>
    <text x="160" y="254" text-anchor="middle" fill="#8b949e" font-size="12">Codex / Claude / MCP Client</text>
    <!-- 箭头1 -->
    <line x1="260" y1="235" x2="330" y2="235" stroke="url(#link)" stroke-width="3"/>
    <polygon points="330,229 344,235 330,241" fill="#bc8cff"/>
    <text x="298" y="222" text-anchor="middle" fill="#8b949e" font-size="11">MCP stdio</text>

    <!-- 节点2 MCP -->
    <rect x="344" y="200" width="200" height="70" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
    <text x="444" y="232" text-anchor="middle" fill="#bc8cff" font-weight="bold">MCP Server</text>
    <text x="444" y="254" text-anchor="middle" fill="#8b949e" font-size="12">8 个有界类型安全工具</text>
    <!-- 箭头2 -->
    <line x1="544" y1="235" x2="614" y2="235" stroke="url(#link)" stroke-width="3"/>
    <polygon points="614,229 628,235 614,241" fill="#bc8cff"/>
    <text x="584" y="222" text-anchor="middle" fill="#8b949e" font-size="11">安全校验</text>

    <!-- 节点3 SAFETY -->
    <rect x="628" y="200" width="200" height="70" rx="12" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="728" y="232" text-anchor="middle" fill="#ff7b72" font-weight="bold">Safety Gateway</text>
    <text x="728" y="254" text-anchor="middle" fill="#8b949e" font-size="12">Fail-Closed · 心跳 · 急停闩锁</text>
    <!-- 箭头3 -->
    <line x1="828" y1="235" x2="898" y2="235" stroke="url(#link)" stroke-width="3"/>
    <polygon points="898,229 912,235 898,241" fill="#bc8cff"/>
    <text x="868" y="222" text-anchor="middle" fill="#8b949e" font-size="11">gz topic</text>

    <!-- 节点4 ROS2+Gazebo -->
    <rect x="912" y="200" width="230" height="70" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="1027" y="232" text-anchor="middle" fill="#3fb950" font-weight="bold">ROS2 + Gazebo</text>
    <text x="1027" y="254" text-anchor="middle" fill="#8b949e" font-size="12">AMR · 24×18m 医院世界</text>
  </g>

  <!-- 数据徽章 -->
  <g font-family="monospace" font-size="15">
    <rect x="60" y="310" width="230" height="44" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="175" y="338" text-anchor="middle" fill="#3fb950">✓ 322 tests passed</text>

    <rect x="320" y="310" width="230" height="44" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="435" y="338" text-anchor="middle" fill="#58a6ff">⏱ 49.6s mission</text>

    <rect x="580" y="310" width="230" height="44" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="695" y="338" text-anchor="middle" fill="#3fb950">✖ 0 collisions</text>

    <rect x="840" y="310" width="300" height="44" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="990" y="338" text-anchor="middle" fill="#bc8cff">🔒 evidence anti-forgery</text>
  </g>

  <!-- 光标 -->
  <rect x="618" y="60" width="4" height="42" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
